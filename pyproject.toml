[project]
name = "dwm-social-media"
version = "0.1.0"
description = "DWM lab techniques on the Student Social Media & Mental Health dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "mlxtend",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = ["playwright", "pytest", "pytest-cov", "httpx"]
